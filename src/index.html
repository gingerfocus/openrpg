<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>OpenRpg</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="icon" href="/favicon.png" />
        <script>
            tailwind.config = { theme: { extend: { fontFamily: {
                mono: ['"Source Code Pro"', 'Monaco', 'Monospace']
            } } } }
        </script>
        <script type="module" src="/core.js"></script>
    </head>
    <body class="bg-black text-gray-100 font-mono min-h-screen">
        <div id="app" class="flex flex-col items-center justify-center min-h-screen p-4">
            <h1 class="text-5xl text-teal-900 mb-8">OpenRpg</h1>
            <div id="dropzone" class="border-4 border-dashed border-teal-700 rounded-lg p-12 text-center cursor-pointer hover:border-teal-500 transition-colors">
                <p class="text-xl text-teal-400 mb-4">Drop character JSON here</p>
                <p class="text-gray-500 mb-4">or</p>
                <label class="px-6 py-3 border-2 border-teal-700 rounded cursor-pointer bg-teal-900 hover:bg-teal-800">
                    Browse Files
                    <input type="file" class="hidden" accept="application/json" id="loadfile">
                </label>
            </div>
        </div>

        <div id="mainscreen" class="hidden p-4">
            <main id="maincontent"></main>
            <div class="fixed bottom-4 right-4 flex gap-2">
                <button id="new-character" class="px-4 py-2 border-2 border-gray-400 rounded cursor-pointer bg-teal-900 hover:bg-teal-800">
                    New Character
                </button>
                <button id="savefile" class="px-4 py-2 border-2 border-gray-400 rounded cursor-pointer bg-teal-900 hover:bg-teal-800">
                    Save To File
                </button>
            </div>
        </div>
    </body>
</html>
